<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #25312e; background: #f5f6f2; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.75; }
    main { width: min(100% - 2rem, 900px); margin: 3rem auto 5rem; }
    header { padding: 2.5rem; background: #e9efe8; border-radius: 1rem; }
    .eyebrow { margin: 0 0 .5rem; font-size: .85rem; letter-spacing: .12em; color: #496b5d; }
    h1 { margin: 0 0 .5rem; font: 600 clamp(2rem, 5vw, 3.5rem)/1.2 Georgia, "Noto Serif SC", serif; }
    .period { margin: 0; color: #50645b; }
    section { margin-top: 1rem; padding: 1.5rem 2rem; background: white; border: 1px solid #e1e6df; border-radius: .8rem; }
    h2 { margin: 0 0 .75rem; font-size: 1.15rem; color: #315b4a; }
    p { margin: 0; }
    ul { margin: 0; padding-left: 1.4rem; }
    li + li { margin-top: .65rem; }
    li strong { color: #315b4a; }
    li span { color: #63746b; }
    @media (max-width: 600px) { main { width: min(100% - 1rem, 900px); margin: .5rem auto 2rem; } header, section { padding: 1.25rem; } }
    @media print { :root { background: white; } body { color: black; } main { width: 100%; margin: 0; } header, section { break-inside: avoid; border-color: #bbb; background: white; } }
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">SELF HARNESS · 周期回顾</p><h1>{{TITLE}}</h1><p class="period">{{PERIOD_LABEL}}</p></header>
    <section aria-labelledby="summary"><h2 id="summary">这段时间</h2><p>{{SUMMARY}}</p></section>
    <section aria-labelledby="observations"><h2 id="observations">分领域观察</h2><ul>{{OBSERVATIONS}}</ul></section>
    <section aria-labelledby="changes"><h2 id="changes">值得关注的变化</h2><ul>{{CHANGES}}</ul></section>
    <section aria-labelledby="recommendations"><h2 id="recommendations">下一步的小调整</h2><ul>{{RECOMMENDATIONS}}</ul></section>
  </main>
</body>
</html>
